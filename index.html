<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>おみくじアプリ</title>
<style>
  :root { font-family: 'Hiragino Kaku Gothic ProN','Yu Gothic',system-ui,sans-serif; color:#3e2930; }
  * {box-sizing:border-box}
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:radial-gradient(circle at top,#fff9ea,#f8dce1); padding:20px; }
  main { width:min(100%,430px); background:#fffdf8; border:2px solid #e8b7c0; border-radius:22px; text-align:center; padding:28px 24px; box-shadow:0 16px 40px #9f3a4a24; }
  .symbol {font-size:48px; margin:0}
  h1{margin:8px 0;color:#b3314a;font-size:32px;letter-spacing:.15em}
  .desc{margin:0 0 22px;color:#82666e}
  button{border:0;border-radius:999px;padding:14px 34px;background:#b3314a;color:white;font-weight:700;font-size:18px;cursor:pointer;box-shadow:0 5px 0 #81253a;transition:transform .15s}
  button:hover{background:#9c2840}
  button:active{transform:translateY(4px);box-shadow:0 1px 0 #81253a}
  button:focus-visible{outline:3px solid #f5a623;outline-offset:4px}
  #result{margin-top:24px;padding:20px;border:2px dashed #dfabb3;border-radius:16px;background:#fff6f4;min-height:165px;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .fortune{font-size:44px;color:#b3314a;font-weight:900;margin:5px 0;animation:appear .35s ease-out}
  .message{font-size:16px;line-height:1.8;margin:5px 0}
  .detail{font-size:14px;color:#745860;margin:7px 0 0}
  @keyframes appear{from{opacity:0;transform:scale(.75)}to{opacity:1;transform:scale(1)}}
  footer{margin-top:17px;color:#997c83;font-size:12px}
  @media(prefers-reduced-motion:reduce){.fortune{animation:none}}
</style>
</head>
<body>
<main>
  <p class="symbol" aria-hidden="true">⛩️</p>
  <h1>今日のおみくじ</h1>
  <p class="desc">ボタンを押して運勢を占おう！</p>
  <button id="draw" type="button">🎋 おみくじを引く</button>
  <section id="result" aria-live="polite" aria-atomic="true">
    <p class="message">今日の運勢は何かな？</p>
  </section>
  <footer>※ おみくじはランダムに表示されます。楽しんでください！</footer>
</main>
<script>
const fortunes = [
  {name:'大吉',message:'最高の一日になりそう！新しいことに挑戦してみよう。',lucky:'ラッキーカラー：金色 🌟'},
  {name:'中吉',message:'うれしい出来事があるかも。笑顔を忘れずに！',lucky:'ラッキーカラー：青色 💙'},
  {name:'小吉',message:'小さな幸せが見つかる日。周りの人に親切に。',lucky:'ラッキーカラー：緑色 🍀'},
  {name:'吉',message:'コツコツ頑張れば良いことが起こりそう。',lucky:'ラッキーカラー：オレンジ 🧡'},
  {name:'末吉',message:'焦らずゆっくり進もう。明日に向けて準備！',lucky:'ラッキーカラー：紫色 💜'},
  {name:'凶',message:'今日は慎重に。落ち着いて行動すれば大丈夫！',lucky:'ラッキーカラー：白色 🤍'}
];
const result = document.getElementById('result');
document.getElementById('draw').addEventListener('click', () => {
  const fortune = fortunes[Math.floor(Math.random() * fortunes.length)];
  result.replaceChildren();
  const name = document.createElement('p'); name.className='fortune'; name.textContent=fortune.name;
  const message = document.createElement('p'); message.className='message'; message.textContent=fortune.message;
  const detail = document.createElement('p'); detail.className='detail'; detail.textContent=fortune.lucky;
  result.append(name,message,detail);
});
</script>
</body>
</html>
